        <!-- Modal Editar-->
        <div
          class="modal fade"
          id="modalEditar"
          tabindex="-1"
          role="dialog"
          aria-labelledby="modalTitleId"
          aria-hidden="true"
        >
          <div class="modal-dialog" role="document">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title" id="modalTitleId">
                  Formulario de Actualizar
                </h5>
                <button
                  type="button"
                  class="btn-close"
                  data-bs-dismiss="modal"
                  aria-label="Close"
                ></button>
              </div>
              <div class="modal-body">
                <div class="container-fluid">
                  <form id="formularioEditar">
                    <div class="mb-3">
                      <label for="" class="form-label">Id</label>
                      <input
                        type="text"
                        class="form-control"
                        name="id"
                        id="id"
                        aria-describedby="helpId"
                        placeholder=""
                        required
                      />
                      <small id="helpId" class="form-text text-body-secondary"
                        >Help text id</small
                      >
                    </div>
                    <div class="mb-3">
                      <label for="" class="form-label">nombre</label>
                      <input
                        type="text"
                        class="form-control"
                        name="nombre"
                        id="nombre"
                        aria-describedby="helpId"
                        placeholder=""
                        required
                      />
                      <small id="helpId" class="form-text text-body-secondary"
                        >Help text nombre</small
                      >
                    </div>
                    <div class="mb-3">
                      <label for="" class="form-label">descripcion</label>
                      <input
                        type="text"
                        class="form-control"
                        name="descripcion"
                        id="descripcion"
                        aria-describedby="helpId"
                        placeholder=""
                        required
                      />
                      <small id="helpId" class="form-text text-body-secondary"
                        >Help text descripcion</small
                      >
                    </div>
                    <div class="mb-3">
                      <label for="" class="form-label">telefono</label>

                        type="text"
                        class="form-control"
                        name="telefono"
                        id="telefono"
                        aria-describedby="helpId"
                        placeholder=""
                        required

                      >
                    </div>
                    <div class="mb-3">
